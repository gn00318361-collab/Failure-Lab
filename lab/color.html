<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>錯誤有多遠？</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main class="wrap"><div class="topbar"><a class="back" href="../index.html">← FAILURE LAB</a><div class="k">先經歷，再理解</div></div><div id="app"></div></main><script src="../assets/js/db.js"></script><script>
const app=document.getElementById('app');let target=Math.floor(Math.random()*360),e1=0;
const cd=(a,b)=>{let d=Math.abs(a-b)%360;return Math.round(Math.min(d,360-d))};
function start(){app.innerHTML='<div class="k">LAB #01</div><h1>記住這個顏色。</h1><div class="color" style="background:hsl('+target+' 70% 55%)"></div><p>3 秒後會消失。</p>';setTimeout(recall1,3000)}
function recall1(){app.innerHTML='<div class="k">ROUND 1</div><h1>剛剛是什麼顏色？</h1><input id="h" type="range" min="0" max="359" value="180"><div id="c" class="color"></div><button onclick="lock1()">送出第一次答案</button>';bind()}
function bind(){let h=document.getElementById('h'),c=document.getElementById('c');let f=()=>c.style.background='hsl('+h.value+' 70% 55%)';h.oninput=f;f()}
function lock1(){e1=cd(+h.value,target);app.innerHTML='<div class="k">FEEDBACK</div><h1>第一次誤差 '+e1+'°</h1><div class="color" style="background:hsl('+target+' 70% 55%)"></div><p>這是原本的目標色。現在再試一次。</p><button onclick="recall2()">第二次作答</button>'}
function recall2(){app.innerHTML='<div class="k">ROUND 2</div><h1>再選一次。</h1><input id="h" type="range" min="0" max="359" value="180"><div id="c" class="color"></div><button onclick="lock2()">送出第二次答案</button>';bind()}
async function lock2(){let e2=cd(+h.value,target),d=e1-e2;await saveExperiment('color',{firstError:e1,secondError:e2,improvement:d});app.innerHTML='<div class="k">YOUR DATA</div><h1>'+e1+'° → '+e2+'°</h1><p>'+(d>0?'第二次縮小了 '+d+'° 的誤差。':'第二次沒有縮小誤差。')+'</p><p class="dbok">✓ 匿名結果已送出</p><div class="note"><h2>研究揭曉</h2><p>你不一定從「錯」變成「對」；你也可能只是離答案更近了。只用對／錯看自己，會漏掉正在發生的進步。<br><br><b>失敗能力 ①｜測量誤差</b><br>下次不要只問：「我失敗了嗎？」改問：「我離目標還差多少？」</p></div><div class="actions"><a class="btn" href="../lecture/index.html#27">接著看完整講義 →</a><a class="btn" href="../index.html">回首頁</a></div>'}
app.innerHTML='<div class="k">LAB #01 · COLOR MEMORY</div><h1>錯誤有多遠？</h1><p>請先記住一個顏色，再憑記憶找回它。</p><button onclick="start()">開始</button>';
</script></body></html>
