<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 03｜如果是你？</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main class="wrap"><div class="topbar"><a class="back" href="../index.html">← FAILURE LAB</a><div class="k">先經歷，再理解</div></div><div id="app"></div></main><script>
const app=document.getElementById('app');let selfChoice='',adviceText='';
const opts=['我怎麼這麼差','早知道就不要做','真的很丟臉','下次再努力','我要找出哪裡出錯','下一次我可以換個方法'];
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function start(){app.innerHTML='<div class="k">STEP 1 · YOUR FAILURE</div><h1>想一件最近「沒有做好」的小事。</h1><p class="lead">不用很嚴重。可能是考差、報告講不好、比賽失誤、忘記準備，或跟朋友有摩擦。</p><p>如果是現在的你，第一個最想對自己說的是：</p><div class="grid">'+opts.map((x,i)=>'<button onclick="choose('+i+')">'+x+'</button>').join('')+'</div>'}
function choose(i){selfChoice=opts[i];app.innerHTML='<div class="k">STEP 2 · SAME FAILURE, DIFFERENT PERSON</div><h1>現在，故事換了一個人。</h1><p class="lead">你的好朋友遇到<b>一模一樣的事情</b>。他跑來問你：「如果是你，你覺得我接下來該怎麼辦？」</p><textarea id="t" style="width:100%;min-height:170px;padding:18px;font-size:18px" placeholder="我會跟他說……"></textarea><div class="actions"><button onclick="compare()">送出我的建議</button></div>'}
function compare(){adviceText=document.getElementById('t').value.trim();if(!adviceText){alert('先留一句你真的會給朋友的建議。');return}app.innerHTML='<div class="k">YOUR WORDS</div><h1>同一個失敗，<br>你說了兩種話。</h1><div class="grid"><div class="note"><div class="k">發生在自己身上</div><h2>「'+esc(selfChoice)+'」</h2></div><div class="note"><div class="k">發生在朋友身上</div><h2>「'+esc(adviceText)+'」</h2></div></div><div class="note"><h2>自己 →「我怎麼了？」<br>別人 →「接下來怎麼辦？」</h2><p>你有發現兩種視角的差別嗎？</p></div><button onclick="reveal()">研究揭曉</button>'}
function reveal(){app.innerHTML='<div class="k">RESEARCH REVEAL</div><h1>你剛才不只是在安慰朋友。</h1><div class="note"><h2>你其實也在替自己的失敗找下一步。</h2><p>當失敗者轉而替別人提供建議，注意力可能從「我怎麼了」移向「接下來可以做什麼」。換一個視角，有機會讓可行策略變得更容易看見。</p></div><div class="note"><div class="k">FAILURE SKILL 03</div><h2>拉開距離</h2><p>當你卡在自己的失敗裡，可以問：<br><b>「如果今天是我的朋友遇到這件事，我會建議他下一步做什麼？」</b></p></div><div class="note"><div class="k">SEND IT BACK</div><p>你剛才給朋友的建議：</p><h2>「'+esc(adviceText)+'」</h2><p><b>現在，把這句話送回給自己。</b></p></div><div class="actions"><a class="btn" href="../lecture/index.html#25">接著看完整講義 →</a><a class="btn secondary" href="../index.html">回實驗室</a></div>'}
app.innerHTML='<div class="k">LAB 03 · GIVE ADVICE</div><h1>如果是你？</h1><p class="lead">同一個失敗，發生在自己與別人身上，我們會看見同樣的東西嗎？</p><button onclick="start()">開始</button>';
</script></body></html>
