<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 04｜你看見多少失敗？</title><link rel="stylesheet" href="../assets/css/app.css"><style>.feed{display:grid;gap:10px;margin:22px 0}.post{background:#fff;padding:15px 17px;border:1px solid #ddd;border-radius:3px}.people{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:24px 0}.person{aspect-ratio:1;border-radius:50%;background:#c8c1b4}.person.win{background:#c3a268}.legend{display:flex;gap:18px;font-weight:800}.bigEq{text-align:center;font-family:Georgia,serif;font-size:clamp(28px,5vw,58px);padding:25px 0}</style></head><body><main class="wrap"><div class="topbar"><a class="back" href="../index.html">← FAILURE LAB</a><div class="k">先經歷，再理解</div></div><div id="app"></div></main><script>
const app=document.getElementById('app');let guess=50;
const posts=['🏆 第三次終於成功了！','🎉 沒想到我真的做到了！','📸 完成！努力果然有回報。','🥇 堅持到最後就是值得！','✨ 今天終於達標。','🔥 做到了，比想像中更開心！','🙌 一直練真的有用。','🏅 成功完成挑戰！','這次沒有成功，下次再試。','還差一點，先休息再來。'];
function start(){app.innerHTML='<div class="k">WHAT YOU CAN SEE</div><h1>100 個人參加了一項困難挑戰。</h1><p>一個月後，你在公開分享中看到了這些故事：</p><div class="feed">'+posts.map(x=>'<div class="post">'+x+'</div>').join('')+'</div><h2>你猜：100 個人裡，最後有多少人成功？</h2><input id="x" type="range" min="0" max="100" value="50"><h1 id="v">50 人</h1><button onclick="guessIt()">確認我的估計</button>';document.getElementById('x').oninput=e=>document.getElementById('v').textContent=e.target.value+' 人'}
function guessIt(){guess=+document.getElementById('x').value;let dots=Array.from({length:100},(_,i)=>'<div class="person '+(i<20?'win':'')+'"></div>').join('');app.innerHTML='<div class="k">WHAT ACTUALLY HAPPENED</div><h1>你猜 '+guess+' 人。<br>實際只有 20 人成功。</h1><div class="people">'+dots+'</div><div class="legend"><span>● 成功 20</span><span style="color:#777">● 失敗 80</span></div><div class="note"><h2>那為什麼剛才看到的幾乎都是成功故事？</h2></div><div class="grid"><button onclick="answer()">成功的人比較厲害</button><button onclick="answer()">失敗的人比較少</button><button onclick="answer()">成功經驗比較容易被分享與看見</button><button onclick="answer()">失敗的人根本沒有故事</button></div>'}
function answer(){app.innerHTML='<div class="k">VISIBLE ≠ REAL</div><h1>真正改變你的，<br>可能不是比例，而是「可見度」。</h1><div class="note"><h2>真實世界</h2><p>成功 20 人　／　失敗 80 人</p></div><div class="note"><h2>你看到的公開故事</h2><p>假設成功者有 16 人分享，失敗者只有 4 人分享——你看到的就會變成 <b>16：4</b>。</p></div><div class="bigEq">你看到的世界<br>≠<br>真正發生的世界</div><button onclick="reveal()">研究揭曉</button>'}
function reveal(){app.innerHTML='<div class="k">RESEARCH REVEAL</div><h1>Failure Gap</h1><div class="note"><h2>失敗的可見性落差</h2><p>我們很容易從「看得見的故事」推測世界真正發生的比例。但成功與失敗不一定以相同比例被分享、記錄與看見。</p></div><div class="note"><div class="k">FAILURE SKILL 04</div><h2>校正樣本</h2><p>當你覺得「別人好像都成功」時，多問一句：</p><h2>「我現在看到的，是全部的人，還是願意被我看見的人？」</h2></div><div class="note"><p><b>看不見失敗，不代表失敗沒有發生。</b></p></div><div class="actions"><a class="btn" href="../lecture/index.html#8">接著看 Failure Gap 與失敗履歷 →</a><a class="btn secondary" href="../index.html">回實驗室</a></div>'}
app.innerHTML='<div class="k">LAB 04 · FAILURE GAP</div><h1>你看見多少失敗？</h1><p class="lead">先不要算比例。這一次，我們只讓你看「別人願意讓你看到的故事」。</p><button onclick="start()">開始</button>';
</script></body></html>
