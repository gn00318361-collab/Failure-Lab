<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Failure Gap</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main class="wrap"><div class="topbar"><a class="back" href="../index.html">← FAILURE LAB</a><div class="k">先經歷，再理解</div></div><div class="k">LAB #04</div><h1>你看見多少失敗？</h1><p>100 個人挑戰一件困難的事，20 個成功、80 個失敗。你猜：最後我們「看見的故事」裡，有多少％會是成功故事？</p><input id="x" type="range" min="0" max="100" value="50"><h2 id="v">50%</h2><button onclick="done()">送出我的估計</button><div id="r"></div></main><script>x.oninput=()=>v.textContent=x.value+'%';function done(){r.innerHTML='<div class="note"><h2>研究揭曉</h2><p>真實世界裡，成功與失敗並不會以相同比例被分享、記錄與看見。「大家都成功」可能只是可見性偏誤。</p><p><b>看不見失敗，不代表失敗沒有發生。</b></p></div><div class="actions"><a class="btn" href="../lecture/index.html#8">接著看完整講義 →</a><a class="btn" href="../index.html">回首頁</a></div>'}</script></body></html>
