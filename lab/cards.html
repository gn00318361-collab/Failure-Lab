<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六張圖卡</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main class="wrap"><div class="topbar"><a class="back" href="../index.html">← FAILURE LAB</a><div class="k">先經歷，再理解</div></div><div id="app"></div></main><script src="../assets/js/db.js"></script><script>
const app=document.getElementById('app'), plants={"山櫻花": "../assets/plants/cherry.webp", "杜鵑": "../assets/plants/azalea.webp", "金針花": "../assets/plants/daylily.webp", "荷花（蓮花）": "../assets/plants/lotus.webp", "臺灣欒樹": "../assets/plants/taiwan-rain-tree.webp", "梅花": "../assets/plants/plum.webp"}, correct={"山櫻花": "春", "杜鵑": "春", "金針花": "夏", "荷花（蓮花）": "夏", "臺灣欒樹": "秋", "梅花": "冬"};let round=1,first={},selected=null;
function card(n){return `<div class="plantCard" draggable="true" data-name="${n}"><img src="${plants[n]}" loading="lazy"><strong>${n}</strong></div>`}
function board(){let ns=Object.keys(plants).sort(()=>Math.random()-.5);app.innerHTML='<div class="k">ROUND '+round+'</div><h1>'+(round===1?'第一次，憑直覺排。':'收到回饋後，再排一次。')+'</h1><div class="plantTray" id="tray">'+ns.map(card).join('')+'</div><div class="seasonGrid">'+['春','夏','秋','冬'].map(s=>'<div class="seasonBox" data-season="'+s+'"><h3>'+s+'</h3></div>').join('')+'</div><div class="actions"><button onclick="submit()">送出</button></div>';wire()}
function wire(){document.querySelectorAll('.plantCard').forEach(c=>{c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.name);c.onclick=()=>{selected=c.dataset.name}});document.querySelectorAll('.seasonBox').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let n=e.dataTransfer.getData('text/plain');z.appendChild(document.querySelector(`[data-name="${n}"]`))};z.onclick=e=>{if(e.target.closest('.plantCard'))return;if(selected){z.appendChild(document.querySelector(`[data-name="${selected}"]`));selected=null}}})}
function placement(){let p={};document.querySelectorAll('.seasonBox').forEach(z=>z.querySelectorAll('.plantCard').forEach(c=>p[c.dataset.name]=z.dataset.season));return p}
function submit(){let p=placement();if(Object.keys(p).length<6){alert('六張都要放進季節框喔！');return}if(round===1){first=p;feedback()}else finish(p)}
function feedback(){let rows=Object.keys(correct).map(n=>'<p>'+n+'：你放 <b>'+first[n]+'</b> → 正確 <b>'+correct[n]+'</b></p>').join('');app.innerHTML='<div class="k">FEEDBACK</div><h1>先看第一次的差距。</h1><div class="note">'+rows+'</div><p>不能只靠花色判斷季節。現在再排一次，看看你會不會更新。</p><button onclick="round=2;board()">第二次排列</button>'}
async function finish(second){let a=0,b=0,ch=0,imp=0;Object.keys(correct).forEach(n=>{if(first[n]===correct[n])a++;if(second[n]===correct[n])b++;if(first[n]!==second[n])ch++;if(first[n]!==correct[n]&&second[n]===correct[n])imp++});await saveExperiment('cards',{firstCorrect:a,secondCorrect:b,changed:ch,improved:imp,firstPlacement:first,secondPlacement:second});app.innerHTML='<div class="k">YOUR DATA</div><h1>'+a+'/6 → '+b+'/6</h1><p>你改動了 <b>'+ch+'</b> 張，其中 <b>'+imp+'</b> 張從錯誤修正為正確。</p><p class="dbok">✓ 匿名結果已送出</p><div class="note"><div class="k">THE TURN</div><h2>收到答案 ≠ 學會答案</h2><p>真正重要的是：你有沒有把回饋帶進下一次判斷。</p></div><div class="note"><div class="k">RESEARCH REVEAL</div><h2>失敗本身不會自動教會我們。</h2><p><b>失敗 → 回饋 → 處理 → 更新</b></p><p>少了中間的注意與處理，看到正確答案，也可能沒有真正更新。</p></div><div class="note"><div class="k">FAILURE SKILL 02</div><h2>利用回饋</h2><p>不是「我知道我錯了」。<br><b>而是「我知道錯在哪裡，而且下一次做得不一樣。」</b></p></div><div class="actions"><a class="btn" href="../lecture/index.html#18">接著看完整講義 →</a><a class="btn" href="../index.html">回首頁</a></div>'}
app.innerHTML='<div class="k">LAB #02 · SIX CARDS</div><h1>六張植物圖卡</h1><p>把六張圖卡放到你認為最具代表性的季節。</p><button onclick="board()">開始排列</button>';
</script></body></html>
